plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.json:json:20250107'
    implementation 'software.amazon.awssdk:s3:2.29.52'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.restolution.arch26demo.client.Main'
}

tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Runs framework-free self-checks (see docs/spec/client.md Testing section).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.restolution.arch26demo.client.selfcheck.SelfCheckRunner'
}
